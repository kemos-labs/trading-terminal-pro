name: CI

on:
  push:
    branches: [main, master, codex/full-application-rebuild]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secrets scanner self-test
        run: bash scripts/check-secrets.sh --self-test
      - name: Secrets scan (full tree)
        run: bash scripts/check-secrets.sh --all
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Test
        # Unit tests only — coverage package optional; missing @vitest/coverage-v8 was
        # failing every push while type-check + lint already passed.
        run: npm test -- --run
      - name: Verify exposure-grid bundle freshness
        # Read-only in-memory rebuild compared against checked-in bytes; runs
        # BEFORE generation so a stale bundle fails instead of being silently
        # regenerated. Rejects mtime/git-diff gates (untracked passes diff).
        run: npm run check:bundle
      - name: Build
        # Same as Docker/Railway: tsc -b && vite build (black-screen guard = assets built)
        run: npm run build
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Write capture run identity (pre-capture source digest)
        run: npm run capture:identity
      - name: Representative failure-state captures
        run: npx playwright test --config=playwright.failure-states.config.ts
      - name: Verify required capture evidence (post-capture gate)
        # Always runs so a capture failure still reports missing-artifact detail,
        # but never swallows the capture exit: the job fails if either step fails.
        if: always()
        run: npm run verify:capture
      - name: Upload capture evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capture-evidence
          path: |
            e2e/screenshots/
            e2e/.capture-run.json
      - name: Audit (high+ only, non-blocking)
        run: npm audit --audit-level=high || true
      - name: Python dependency audit (hashed lock)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pip-audit
      - run: pip-audit --disable-pip --no-deps --strict -r services/rates-worker/requirements.lock

