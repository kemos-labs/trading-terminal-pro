  <text x="160" y="310" fill="#f3efe6" font-family="ui-sans-serif" font-size="14">Growth soft</text>
  <text x="620" y="310" fill="#f3efe6" font-family="ui-sans-serif" font-size="14">Policy tool conflict</text>
