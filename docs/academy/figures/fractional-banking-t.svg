<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="Bank balance sheet loan creates deposit">
  <rect width="960" height="520" fill="#0b1220"/>
  <text x="40" y="44" fill="#e8edf5" font-family="Georgia, serif" font-size="26" font-weight="700">Loan creates a deposit (T-account sketch)</text>
  <text x="40" y="78" fill="#9aa8bc" font-family="system-ui" font-size="16">Banks do not “lend out” pre-existing cash first — credit creates a matching liability</text>
  <text x="200" y="130" text-anchor="middle" fill="#c4a574" font-family="system-ui" font-size="18" font-weight="700">Bank assets</text>
  <text x="560" y="130" text-anchor="middle" fill="#c4a574" font-family="system-ui" font-size="18" font-weight="700">Bank liabilities</text>
  <rect x="80" y="150" width="240" height="90" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="200" y="190" text-anchor="middle" fill="#93c5fd" font-family="system-ui" font-size="18" font-weight="700">+ Loan</text>
  <text x="200" y="220" text-anchor="middle" fill="#9aa8bc" font-family="system-ui" font-size="14">claim on borrower</text>
  <rect x="440" y="150" width="240" height="90" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="560" y="190" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="18" font-weight="700">+ Deposit</text>
  <text x="560" y="220" text-anchor="middle" fill="#9aa8bc" font-family="system-ui" font-size="14">claim of borrower</text>
  <rect x="80" y="280" width="800" height="180" rx="10" fill="#141a22" stroke="#334155"/>
  <text x="100" y="320" fill="#e8edf5" font-family="system-ui" font-size="18" font-weight="700">What actually limits lending</text>
  <text x="100" y="360" fill="#9aa8bc" font-family="system-ui" font-size="16">• Capital (equity buffer) and risk-weighted assets</text>
  <text x="100" y="395" fill="#9aa8bc" font-family="system-ui" font-size="16">• Liquidity / funding (can you keep the deposit or refinance wholesale?)</text>
  <text x="100" y="430" fill="#9aa8bc" font-family="system-ui" font-size="16">• Credit demand, underwriting, and supervision — not a cartoon “10% reserve multiplier” story alone</text>
</svg>
