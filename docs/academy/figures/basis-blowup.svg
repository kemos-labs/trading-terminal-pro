<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img">
  <rect width="960" height="420" fill="#0b1220"/>
  <text x="40" y="44" fill="#e8edf5" font-family="Georgia, serif" font-size="26" font-weight="700">Basis unwind amplifiers</text>
  <rect x="40" y="100" width="280" height="100" rx="8" fill="#1e293b" stroke="#c4a574" stroke-width="2"/>
  <text x="180" y="145" text-anchor="middle" fill="#e6c35c" font-size="17" font-weight="700">Repo / funding</text>
  <text x="180" y="175" text-anchor="middle" fill="#9aa8bc" font-size="14">specials · haircuts</text>
  <rect x="340" y="100" width="280" height="100" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="480" y="145" text-anchor="middle" fill="#fca5a5" font-size="17" font-weight="700">Margin / futures</text>
  <text x="480" y="175" text-anchor="middle" fill="#9aa8bc" font-size="14">variation · limits</text>
  <rect x="640" y="100" width="280" height="100" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="780" y="145" text-anchor="middle" fill="#93c5fd" font-size="17" font-weight="700">Crowding</text>
  <text x="780" y="175" text-anchor="middle" fill="#9aa8bc" font-size="14">same trade, same exit</text>
  <text x="40" y="260" fill="#9aa8bc" font-size="16">Cash long + futures short (classic long basis) needs stable financing and calm margins.</text>
  <text x="40" y="300" fill="#9aa8bc" font-size="16">When both tighten together, forced de-lever sells cash and lifts futures — basis blows out.</text>
</svg>
