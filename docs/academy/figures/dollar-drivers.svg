  <text x="60" y="275" fill="#e8edf5" font-family="system-ui" font-size="17" font-weight="700">Pair with plumbing</text>
  <text x="60" y="315" fill="#9aa8bc" font-family="system-ui" font-size="15">Cross-currency basis and offshore dollar funding can confirm stress even when DXY headlines lag.</text>
  <text x="60" y="345" fill="#9aa8bc" font-family="system-ui" font-size="15">See also: FX / xccy basis essay and global flows / BOP in Macro.</text>
