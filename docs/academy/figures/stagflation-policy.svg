  <polygon points="480,70 280,280 680,280" fill="none" stroke="#c4a574" stroke-width="2"/>
  <circle cx="480" cy="70" r="8" fill="#c4a574"/>
  <circle cx="280" cy="280" r="8" fill="#e85d4c"/>
  <circle cx="680" cy="280" r="8" fill="#3d8bfd"/>
