<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Dollar strength drivers">
  <rect width="960" height="420" fill="#0b1220"/>
  <text x="40" y="44" fill="#e8edf5" font-family="Georgia, serif" font-size="26" font-weight="700">Why \$ can stay bid (checklist, not forecast)</text>
  <rect x="40" y="100" width="200" height="90" rx="8" fill="#1e293b" stroke="#c4a574" stroke-width="2"/>
  <text x="140" y="155" text-anchor="middle" fill="#e6c35c" font-family="system-ui" font-size="16" font-weight="700">Rate differentials</text>
  <rect x="270" y="100" width="200" height="90" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="370" y="155" text-anchor="middle" fill="#93c5fd" font-family="system-ui" font-size="16" font-weight="700">Safe-haven demand</text>
  <rect x="500" y="100" width="200" height="90" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="600" y="155" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="16" font-weight="700">Deep markets</text>
