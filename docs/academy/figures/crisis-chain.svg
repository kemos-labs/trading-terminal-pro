<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img">
  <rect width="960" height="420" fill="#0b1220"/>
  <text x="40" y="44" fill="#e8edf5" font-family="Georgia, serif" font-size="26" font-weight="700">Transmission template (not a diary)</text>
  <rect x="40" y="120" width="160" height="80" rx="8" fill="#1e293b" stroke="#c4a574" stroke-width="2"/>
  <text x="120" y="168" text-anchor="middle" fill="#e6c35c" font-size="16" font-weight="700">Shock</text>
  <text x="210" y="165" fill="#9aa8bc" font-size="24">→</text>
  <rect x="240" y="120" width="160" height="80" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="320" y="168" text-anchor="middle" fill="#93c5fd" font-size="16" font-weight="700">Funding</text>
  <text x="410" y="165" fill="#9aa8bc" font-size="24">→</text>
  <rect x="440" y="120" width="160" height="80" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="520" y="168" text-anchor="middle" fill="#fca5a5" font-size="16" font-weight="700">Credit</text>
  <text x="610" y="165" fill="#9aa8bc" font-size="24">→</text>
  <rect x="640" y="120" width="160" height="80" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="720" y="155" text-anchor="middle" fill="#86efac" font-size="16" font-weight="700">Risk assets</text>
  <text x="720" y="180" text-anchor="middle" fill="#9aa8bc" font-size="13">FX · equities</text>
  <text x="40" y="260" fill="#9aa8bc" font-size="16">Ask at each step: who is forced to sell? What collateral is impaired? Where is the dollar?</text>
  <text x="40" y="300" fill="#9aa8bc" font-size="16">Template works for property developers, banks, or sovereigns — change the labels, keep the chain.</text>
