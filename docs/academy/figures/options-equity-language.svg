<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Options language for equities">
  <rect width="960" height="420" fill="#0b1220"/>
  <text x="40" y="44" fill="#e8edf5" font-family="Georgia, serif" font-size="26" font-weight="700">Options surface as a language for equity risk</text>
  <rect x="40" y="100" width="270" height="120" rx="10" fill="#1e293b" stroke="#c4a574" stroke-width="2"/>
  <text x="175" y="150" text-anchor="middle" fill="#e6c35c" font-family="system-ui" font-size="18" font-weight="700">Term structure</text>
  <text x="175" y="185" text-anchor="middle" fill="#9aa8bc" font-family="system-ui" font-size="14">event risk vs grind</text>
  <rect x="345" y="100" width="270" height="120" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="480" y="150" text-anchor="middle" fill="#93c5fd" font-family="system-ui" font-size="18" font-weight="700">Skew / RR</text>
  <text x="480" y="185" text-anchor="middle" fill="#9aa8bc" font-family="system-ui" font-size="14">crash vs melt-up price</text>
  <rect x="650" y="100" width="270" height="120" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="785" y="150" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="18" font-weight="700">VRP / IV vs RV</text>
  <text x="785" y="185" text-anchor="middle" fill="#9aa8bc" font-family="system-ui" font-size="14">is insurance rich?</text>
  <rect x="40" y="260" width="880" height="110" rx="10" fill="#141a22" stroke="#334155"/>
  <text x="60" y="310" fill="#e8edf5" font-family="system-ui" font-size="17" font-weight="700">Not a crystal ball</text>
  <text x="60" y="345" fill="#9aa8bc" font-family="system-ui" font-size="15">Surface prices risk. Spot can ignore it for a long time. Use Vol desk tools to read levels; do not treat put/call ratios as signals alone.</text>
</svg>
