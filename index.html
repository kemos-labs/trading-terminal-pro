<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kemos Research — Options Trading Terminal</title>
    <!-- Inline dark shell so a failed JS load never shows a blank white page -->
    <style>
      html, body { height: 100%; margin: 0; background: #0e1014; color: #e8eaed; }
      #root { min-height: 100%; }
      #boot-fallback {
        display: none; font-family: ui-monospace, monospace; padding: 2rem;
        max-width: 36rem; margin: 0 auto;
      }
      #boot-fallback.show { display: block; }
      #boot-fallback h1 { font-size: 1rem; letter-spacing: 0.12em; text-transform: uppercase; color: #8b919c; }
      #boot-fallback p { color: #c4c8d0; line-height: 1.5; }
      #boot-fallback a { color: #6b9fd4; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" aria-live="polite">
      <h1>Kemos Research</h1>
      <p>Loading terminal… If this stays blank, hard-refresh (Ctrl+Shift+R) or check that JS assets load.</p>
    </div>
    <script src="/boot-fallback.js"></script>
    <!--
      Vite 8 + @vitejs/plugin-react 6 should inject this via transformIndexHtml.
      In this environment the preamble is missing and every TSX dies with
      "$RefreshSig$ is not defined" → black #root. Explicit import is safe:
      production build strips / ignores the refresh runtime path.
    -->
    <script type="module">
      import { injectIntoGlobalHook } from '/@react-refresh';
      injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
