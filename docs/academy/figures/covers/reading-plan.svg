<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#12161e"/>
      <stop offset="100%" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4a574"/>
      <stop offset="100%" stop-color="#a8834a"/>
    </linearGradient>
  </defs>
  <rect width="880" height="440" fill="url(#bg)" rx="0"/>
  <!-- Decorative lines -->
  <line x1="40" y1="80" x2="840" y2="80" stroke="#c4a574" stroke-width="1" opacity="0.3"/>
  <line x1="40" y1="360" x2="840" y2="360" stroke="#c4a574" stroke-width="1" opacity="0.3"/>
  <line x1="40" y1="80" x2="40" y2="360" stroke="#c4a574" stroke-width="1" opacity="0.2"/>
  <line x1="840" y1="80" x2="840" y2="360" stroke="#c4a574" stroke-width="1" opacity="0.2"/>
  <!-- Week markers -->
  <circle cx="80" cy="200" r="4" fill="#c4a574" opacity="0.6"/>
  <circle cx="160" cy="220" r="3" fill="#4a6fa5" opacity="0.5"/>
  <circle cx="240" cy="190" r="4" fill="#c4a574" opacity="0.6"/>
  <circle cx="320" cy="230" r="3" fill="#4a6fa5" opacity="0.5"/>
  <circle cx="400" cy="210" r="4" fill="#c4a574" opacity="0.6"/>
  <circle cx="480" cy="195" r="3" fill="#4a6fa5" opacity="0.5"/>
  <circle cx="560" cy="225" r="4" fill="#c4a574" opacity="0.6"/>
  <circle cx="640" cy="205" r="3" fill="#4a6fa5" opacity="0.5"/>
  <circle cx="720" cy="215" r="4" fill="#c4a574" opacity="0.6"/>
  <circle cx="800" cy="195" r="3" fill="#4a6fa5" opacity="0.5"/>
  <!-- Connecting lines -->
  <polyline points="80,200 160,220 240,190 320,230 400,210 480,195 560,225 640,205 720,215 800,195"
    fill="none" stroke="#c4a574" stroke-width="0.5" opacity="0.25"/>
  <!-- Title -->
  <text x="440" y="160" text-anchor="middle" fill="#f3efe6" font-family="ui-serif, Georgia, serif" font-size="34" font-weight="700" letter-spacing="-0.02em">Learning Trading</text>
  <text x="440" y="200" text-anchor="middle" fill="#c4a574" font-family="ui-serif, Georgia, serif" font-size="20" font-weight="400" letter-spacing="0.06em" opacity="0.9">for Real</text>
  <!-- Subtitle -->
  <text x="440" y="270" text-anchor="middle" fill="#9aa8bc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" opacity="0.8">A week-by-week reading path</text>
  <text x="440" y="295" text-anchor="middle" fill="#9aa8bc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" opacity="0.6">Built from practitioner sources — not gurus</text>
  <!-- Bottom note -->
  <text x="440" y="340" text-anchor="middle" fill="#6b7a8f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" opacity="0.5">Weeks 1–5 framework · Weeks 6–12 depth · Beyond optional</text>
</svg>
