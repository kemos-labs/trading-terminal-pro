<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img">
  <rect width="960" height="480" fill="#0b1220"/>
  <text x="40" y="44" fill="#e8edf5" font-family="Georgia, serif" font-size="26" font-weight="700">Product taxonomy (simplified)</text>
  <rect x="40" y="90" width="140" height="70" rx="8" fill="#1e293b" stroke="#c4a574" stroke-width="2"/>
  <text x="110" y="132" text-anchor="middle" fill="#e6c35c" font-size="15" font-weight="700">Equities</text>
  <rect x="200" y="90" width="140" height="70" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="270" y="132" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="700">ETFs</text>
  <rect x="360" y="90" width="140" height="70" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="430" y="132" text-anchor="middle" fill="#86efac" font-size="15" font-weight="700">Funds</text>
  <rect x="520" y="90" width="140" height="70" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="590" y="132" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="700">Indices</text>
  <rect x="680" y="90" width="120" height="70" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="740" y="122" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">FX / Crypto</text>
  <text x="740" y="145" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">/ MM</text>
  <rect x="40" y="200" width="880" height="220" rx="10" fill="#141a22" stroke="#334155"/>
  <text x="60" y="245" fill="#e8edf5" font-size="17" font-weight="700">Labels that matter</text>
  <text x="60" y="285" fill="#9aa8bc" font-size="15">Sector · industry · country · exchange · category / family (ETFs &amp; funds)</text>
  <text x="60" y="325" fill="#9aa8bc" font-size="15">Open databases (e.g. FinanceDatabase, MIT) map 100k+ symbols to these fields — for discovery, not live prices.</text>
  <text x="60" y="365" fill="#9aa8bc" font-size="15">Use classification to build a universe; use market data APIs for the tape.</text>
</svg>
